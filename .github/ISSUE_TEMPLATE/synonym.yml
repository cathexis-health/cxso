name: Synonym
description: Propose an everyday word or phrase for an existing CSO term.
title: "[Synonym] "
labels: ["synonym"]
body:
  - type: input
    id: word
    attributes:
      label: Word or phrase
    validations:
      required: true
  - type: input
    id: term
    attributes:
      label: Existing term and code
      description: For example, Tightness (CXSO:0000041).
    validations:
      required: true
  - type: textarea
    id: usage
    attributes:
      label: Where it is used
      description: Who uses this word and in what context. A word codes to one term only.
